<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Anúncio - Melhor Companhia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-black text-rose-600 tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-crown text-amber-400 text-xl"></i>
        MELHOR<span class="text-white">COMPANHIA</span>
      </a>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-10 flex-grow w-full">
    <div class="bg-slate-900 p-6 sm:p-8 rounded-2xl border border-slate-800 shadow-xl">
      <h1 class="text-2xl font-extrabold text-white mb-2">Criar Novo Anúncio</h1>
      <p class="text-slate-400 text-sm mb-6">Preencha os dados do seu perfil para publicar na plataforma.</p>

      <form id="cadastroForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Nome / Apelido *</label>
          <input type="text" id="cadNome" required placeholder="Ex: Camila Silva" class="w-full bg-slate-800 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-sm focus:border-rose-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Idade *</label>
            <input type="number" id="cadIdade" min="18" required placeholder="Ex: 24" class="w-full bg-slate-800 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-sm focus:border-rose-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Gênero *</label>
            <select id="cadGenero" required class="w-full bg-slate-800 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-sm focus:border-rose-500 focus:outline-none">
              <option value="Mulheres">Mulher</option>
              <option value="Homens">Homem</option>
              <option value="Trans">Trans</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Cidade / Estado *</label>
            <input type="text" id="cadCidade" required placeholder="Ex: São Paulo, SP" class="w-full bg-slate-800 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-sm focus:border-rose-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Valor por Hora (R$) *</label>
            <input type="number" id="cadValor" required placeholder="Ex: 250" class="w-full bg-slate-800 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-sm focus:border-rose-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">WhatsApp (apenas números) *</label>
            <input type="text" id="cadWhatsapp" required placeholder="Ex: 11999998888" class="w-full bg-slate-800 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-sm focus:border-rose-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Tipo de Local *</label>
            <select id="cadLocal" required class="w-full bg-slate-800 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-sm focus:border-rose-500 focus:outline-none">
              <option value="Com Local">Com Local</option>
              <option value="A Domicílio">A Domicílio</option>
              <option value="Motéis">Apenas Motéis</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Link da Foto de Capa (URL Image) *</label>
          <input type="url" id="cadFoto" required placeholder="https://exemplo.com/sua-foto.jpg" class="w-full bg-slate-800 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-sm focus:border-rose-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Descrição do Anúncio *</label>
          <textarea id="cadDescricao" rows="3" required placeholder="Descreva seus serviços, horários e observações..." class="w-full bg-slate-800 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-sm focus:border-rose-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-rose-600/30 text-sm mt-2">
          Publicar Anúncio
        </button>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
