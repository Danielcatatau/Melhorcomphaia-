<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Melhor Companhia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-black text-rose-600 tracking-wider flex items-center gap-2">
        <i class="fa-solid fa-crown text-amber-400 text-xl"></i>
        MELHOR<span class="text-white">COMPANHIA</span>
      </a>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-12 w-full">
    <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-xl text-center">
      <h1 class="text-2xl font-extrabold text-white mb-2">Área do Anunciante</h1>
      <p class="text-slate-400 text-xs mb-6">Acesse seu painel para gerenciar anúncios</p>

      <form onsubmit="alert('Modo de demonstração ativado!'); return false;" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">E-mail</label>
          <input type="email" required placeholder="seu@email.com" class="w-full bg-slate-800 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-sm focus:border-rose-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Senha</label>
          <input type="password" required placeholder="••••••••" class="w-full bg-slate-800 text-white px-3 py-2.5 rounded-xl border border-slate-700 text-sm focus:border-rose-500 focus:outline-none">
        </div>

        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-rose-600/30 text-sm mt-2">
          Entrar
        </button>
      </form>

      <div class="mt-6 text-xs text-slate-400">
        Não tem uma conta? <a href="cadastro.html" class="text-rose-500 hover:underline font-bold">Cadastre-se aqui</a>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-900 py-4 text-slate-500 text-xs text-center">
    &copy; 2026 Melhor Companhia.
  </footer>
</body>
</html>
